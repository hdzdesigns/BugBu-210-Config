# ==============================================================================
# BUGBU MASTER LCD MENU (PRUSA-STYLE HIERARCHY)
# ==============================================================================
# Overrides Klipper's default messy menu with a clean, hardware-aware layout.

### ROOT MENU REDEFINITION ###
[menu __main]
type: list
name: Main

# ==============================================================================
# 1. ACTIVE PRINT CONTROLS (Only visible during a print/pause)
# ==============================================================================
[menu __main __resume]
type: command
enable: {('virtual_sdcard' in printer) and printer.print_stats.state == "paused"}
name: Resume Print
gcode:
    RESUME

[menu __main __pause]
type: command
enable: {('virtual_sdcard' in printer) and printer.print_stats.state == "printing"}
name: Pause Print
gcode:
    PAUSE

[menu __main __cancel]
type: command
enable: {('virtual_sdcard' in printer) and (printer.print_stats.state == "printing" or printer.print_stats.state == "paused")}
name: Cancel Print
gcode:
    CANCEL_PRINT

[menu __main __tune]
type: list
enable: {printer.print_stats.state == "printing" or printer.print_stats.state == "paused"}
name: Tune Print

[menu __main __tune __offsetz]
type: input
name: Z-Babystep:{'%05.3f' % menu.input}
input: {printer.gcode_move.homing_origin.z}
input_min: -2.0
input_max: 2.0
input_step: 0.005
realtime: True
gcode:
    SET_GCODE_OFFSET Z_ADJUST={'%.3f' % menu.input} MOVE=1

[menu __main __tune __speed]
type: input
name: Speed: {'%3d' % (menu.input*100)}%
input: {printer.gcode_move.speed_factor}
input_min: 0.01
input_max: 5
input_step: 0.01
realtime: True
gcode:
    M220 S{'%d' % (menu.input*100)}

[menu __main __tune __flow]
type: input
name: Flow: {'%3d' % (menu.input*100)}%
input: {printer.gcode_move.extrude_factor}
input_min: 0.01
input_max: 2
input_step: 0.01
realtime: True
gcode:
    M221 S{'%d' % (menu.input*100)}

[menu __main __tune __fanspeed]
type: input
name: Part Fan: {'%3d' % (menu.input*100)}%
input: {printer["fan"].speed}
input_min: 0
input_max: 1
input_step: 0.01
realtime: True
gcode:
    M106 S{'%d' % (menu.input*255)}

# ==============================================================================
# 2. FILE SELECTION
# ==============================================================================
[menu __main __sdcard]
type: vsdlist
enable: {not (printer.print_stats.state == "paused" or printer.print_stats.state == "printing")}
name: Print from SD

# ==============================================================================
# 3. SMART FILAMENT HANDLING
# ==============================================================================
[menu __main __filament]
type: list
enable: {not (printer.print_stats.state == "paused" or printer.print_stats.state == "printing")}
name: Filament

[menu __main __filament __load]
type: command
name: Smart Load
gcode:
    LOAD_FILAMENT

[menu __main __filament __unload]
type: command
name: Smart Unload
gcode:
    UNLOAD_FILAMENT

[menu __main __filament __cooldown]
type: command
name: Cooldown
gcode:
    M104 S0
    M140 S0

# ==============================================================================
# 4. TEMPERATURE CONTROLS
# ==============================================================================
[menu __main __temp]
type: list
enable: {not (printer.print_stats.state == "paused" or printer.print_stats.state == "printing")}
name: Temperature

[menu __main __temp __hotend]
type: input
name: Nozzle: {'%3.0f' % menu.input}
input: {printer.extruder.target}
input_min: 0
input_max: {printer.configfile.config.extruder.max_temp}
input_step: 5
gcode: M104 S{'%.0f' % menu.input}

[menu __main __temp __hotbed]
type: input
name: Bed: {'%3.0f' % menu.input}
input: {printer.heater_bed.target}
input_min: 0
input_max: {printer.configfile.config.heater_bed.max_temp}
input_step: 5
gcode: M140 S{'%.0f' % menu.input}

[menu __main __temp __preheat_pla]
type: command
name: Preheat PLA
gcode:
    M140 S60
    M104 S210

[menu __main __temp __preheat_petg]
type: command
name: Preheat PETG
gcode:
    M140 S80
    M104 S240

[menu __main __temp __preheat_abs]
type: command
name: Preheat ABS
gcode:
    M140 S100
    M104 S250

[menu __main __temp __cooldown]
type: command
name: Cooldown All
gcode:
    M104 S0
    M140 S0

# ==============================================================================
# 5. KINEMATIC CONTROLS (Motors & Movement)
# ==============================================================================
[menu __main __control]
type: list
enable: {not (printer.print_stats.state == "paused" or printer.print_stats.state == "printing")}
name: Motion

[menu __main __control __home]
type: command
name: Auto Home
gcode: _CHOME

[menu __main __control __disable]
type: command
name: Steppers Off
gcode: M84

[menu __main __control __move_10mm]
type: list
name: Move 10mm

[menu __main __control __move_10mm __axis_x]
type: input
name: Move X:{'%05.1f' % menu.input}
input: {printer.gcode_move.gcode_position.x}
input_min: {printer.toolhead.axis_minimum.x}
input_max: {printer.toolhead.axis_maximum.x}
input_step: 10.0
gcode:
    SAVE_GCODE_STATE NAME=__move__axis
    G90
    G1 X{menu.input} F3000
    RESTORE_GCODE_STATE NAME=__move__axis

[menu __main __control __move_10mm __axis_y]
type: input
name: Move Y:{'%05.1f' % menu.input}
input: {printer.gcode_move.gcode_position.y}
input_min: {printer.toolhead.axis_minimum.y}
input_max: {printer.toolhead.axis_maximum.y}
input_step: 10.0
gcode:
    SAVE_GCODE_STATE NAME=__move__axis
    G90
    G1 Y{menu.input} F3000
    RESTORE_GCODE_STATE NAME=__move__axis

[menu __main __control __move_10mm __axis_z]
type: input
name: Move Z:{'%05.1f' % menu.input}
input: {printer.gcode_move.gcode_position.z}
input_min: 0
input_max: {printer.toolhead.axis_maximum.z}
input_step: 10.0
gcode:
    SAVE_GCODE_STATE NAME=__move__axis
    G90
    G1 Z{menu.input} F900
    RESTORE_GCODE_STATE NAME=__move__axis

[menu __main __control __move_1mm]
type: list
name: Move 1mm

[menu __main __control __move_1mm __axis_z]
type: input
name: Move Z:{'%05.1f' % menu.input}
input: {printer.gcode_move.gcode_position.z}
input_min: 0
input_max: {printer.toolhead.axis_maximum.z}
input_step: 1.0
gcode:
    SAVE_GCODE_STATE NAME=__move__axis
    G90
    G1 Z{menu.input} F900
    RESTORE_GCODE_STATE NAME=__move__axis

[menu __main __control __move_1mm __axis_e]
type: input
name: Extrude:{'%+06.1f' % menu.input}
input: 0
input_min: -50
input_max: 50
input_step: 1.0
gcode:
    SAVE_GCODE_STATE NAME=__move__axis
    M83
    G1 E{menu.input} F240
    RESTORE_GCODE_STATE NAME=__move__axis

# ==============================================================================
# 6. CALIBRATION (Eddy-NG & PID)
# ==============================================================================
[menu __main __calibration]
type: list
enable: {not (printer.print_stats.state == "paused" or printer.print_stats.state == "printing")}
name: Calibration

[menu __main __calibration __eddy_mesh]
type: command
name: Rapid Bed Mesh
gcode: 
    BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1
    SAVE_CONFIG

[menu __main __calibration __eddy_tap]
type: command
name: Test Eddy Tap
gcode:
    _CHOME
    PROBE_EDDY_NG_TAP TARGET_Z=-1.500

[menu __main __calibration __master_pid]
type: command
name: Master PID Sweep
gcode:
    CALIBRATE_ALL_PID

[menu __main __calibration __save_config]
type: command
name: Save & Restart
gcode:
    SAVE_CONFIG

# ==============================================================================
# 7. NEOPIXEL LIGHTING
# ==============================================================================
[menu __main __led]
type: list
name: Lighting

[menu __main __led __ready]
type: command
name: State: Ready
gcode: status_ready

[menu __main __led __printing]
type: command
name: State: Printing
gcode: status_printing

[menu __main __led __off]
type: command
name: Turn Off
gcode: status_off