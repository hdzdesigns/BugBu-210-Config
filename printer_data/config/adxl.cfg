[mcu adxl]
serial: /dev/serial/by-id/usb-Klipper_rp2040_adxl-if00
is_non_critical: True
restart_method: command

[adxl345]
cs_pin: adxl:gpio1
spi_bus: spi0a
axes_map: x, y, z

[resonance_tester]
accel_chip: adxl345
probe_points:
    105,100,20
max_smoothing: 0.25
hz_per_sec: 1.0
accel_per_hz: 100

[temperature_sensor adxl]
sensor_type: temperature_mcu
sensor_mcu: adxl
min_temp: 10
max_temp: 100

# [neopixel rp2040_zero]
# pin: adxl:gpio16
# chain_count: 1
# color_order: GRB
# initial_RED: 1.0
# initial_GREEN: 1.0
# initial_BLUE: 0.0

[gcode_macro ADXL]
description: Auto Accelerometer calibration
gcode:
    RESPOND TYPE=echo MSG="📊 ADXL: Starting Input Shaper Calibration..."
    _CHOME
    RESPOND TYPE=echo MSG="📊 ADXL: Ensuring heaters and fans are OFF."
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    M106 S0
    # SET_LED LED="rp2040_zero" RED=1 GREEN=0 BLUE=0 TRANSMIT=1
    SHAPER_CALIBRATE
    # SET_LED LED="rp2040_zero" RED=0 GREEN=1 BLUE=0 TRANSMIT=1
    RESPOND TYPE=echo MSG="✅ ADXL: Calibration Complete! Type SAVE_CONFIG."

[delayed_gcode init_adxl]
initial_duration: 5.0
gcode:
    # This forces a probe of the ADXL after the printer is already "Ready"
    ACCELEROMETER_QUERY