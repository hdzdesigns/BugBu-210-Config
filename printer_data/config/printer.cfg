#  53.0, 0.5
#  55.0, 0.7
#  60.0, 1.0
# cooling_hysteresis: 1.0
# heating_hysteresis: 2.0

[temperature_sensor mcu]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 5000
minimum_cruise_ratio: 0
square_corner_velocity: 80.0
max_z_velocity: 15
max_z_accel: 300

########################################
# TMC UART configuration
########################################

[tmc2209 stepper_x]
uart_pin: PD9
interpolate: False
run_current: 1.0
hold_current: 0.5
sense_resistor: 0.110
diag_pin: ^PD3          # Note: Adding a pull-up (^) is highly recommended for sensorless reliability
home_current: 0.5       # KALICO: Drops current by 50% during homing for a gentle bump
current_change_dwell_time: 0.5 # KALICO: Waits 0.5s after dropping current to prevent false triggers

[tmc2209 stepper_y]
uart_pin: PD8
interpolate: False
run_current: 1.0
hold_current: 0.5
sense_resistor: 0.110
diag_pin: ^PD2          # Note: Adding a pull-up (^)
home_current: 0.5       # KALICO: Gentle bump current
current_change_dwell_time: 0.5 # KALICO: Stabilization delay

[tmc2209 stepper_z]
uart_pin: PB10
interpolate: False
run_current: 1.3
hold_current: 0.7
sense_resistor: 0.110

[tmc2209 extruder]
uart_pin: PB2
interpolate: False
run_current: 1.0
hold_current: 0.5
sense_resistor: 0.110

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PD5,  EXP1_3=PB3,  EXP1_5=PB5,  EXP1_7=PB7,  EXP1_9=<GND>,
    EXP1_2=PD4,  EXP1_4=PD6,  EXP1_6=PB4,  EXP1_8=PB6,  EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB14, EXP2_3=PB8,  EXP2_5=PC10, EXP2_7=PC12, EXP2_9=<GND>,
    EXP2_2=PB13, EXP2_4=PB9,  EXP2_6=PB15, EXP2_8=<RST>, EXP2_10=<NC>

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

