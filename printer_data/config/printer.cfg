[tmc2209 stepper_x]
driver_SGTHRS: 60  # Adjust for sensitivity

[tmc2209 stepper_y]
driver_SGTHRS: 95  # Adjust for sensitivity

[mcu CB1]
serial: /tmp/klipper_host_mcu

[mcu]
canbus_uuid: 74d8c6b188df

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044506110C1431C-if00
restart_method: command

[include macro.cfg]
[include screen.cfg]
# [include adxl.cfg]
[include sfs.cfg]

[force_move]
enable_force_move: True

[gcode_arcs]
resolution: 1.0

[exclude_object]

[save_variables]
filename: ~/printer_data/config/variables.cfg

[stepper_x]
step_pin: PC8
dir_pin: !PC9
enable_pin: !PA15
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 215
homing_speed: 40             # Speed of the first fast bump
homing_retract_dist: 8       # Backs off 8mm after the first bump
homing_retract_speed: 20     # KALICO: Slower speed for the second precision bump
min_home_dist: 5             # KALICO: Ensures the head isn't already resting on the endstop
use_sensorless_homing: true

[stepper_y]
step_pin: PA10
dir_pin: !PA14
enable_pin: !PA13
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 200
position_max: 200
homing_speed: 40             # Speed of the first fast bump
homing_retract_dist: 8       # Backs off 8mm after the first bump
homing_retract_speed: 20     # KALICO: Slower speed for the second precision bump
min_home_dist: 5             # KALICO: Ensures the head isn't already resting on the endstop
use_sensorless_homing: true

[stepper_z]
step_pin: PC6
dir_pin: !PC7
enable_pin: !PA9
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -4
position_max: 200

[extruder]
step_pin: PB12
dir_pin: !PB11
enable_pin: !PA8
microsteps: 16
gear_ratio: 50:8
rotation_distance: 28.334 
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC5 
sensor_type: ATC Semitec 104GT-2
sensor_pin: PA1
min_temp: -199
max_temp: 320
max_extrude_cross_section: 8
max_extrude_only_distance: 500
pressure_advance: 0.046

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
min_temp: -199
max_temp: 130

[probe_eddy_ng btt_eddy]
sensor_type: btt_eddy
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 36.82
y_offset: -18.23

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26

[bed_mesh]
horizontal_move_z: 2
speed: 100
mesh_min: 40, 25
mesh_max: 190, 180
probe_count: 20, 11
algorithm: bicubic

[homing_override]
axes: xyz
set_position_z: 0
gcode:
  FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=15 ACCEL=100
  G90
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% if home_all or 'X' in params %}
    G28 X
  {% endif %}
  {% if home_all or 'Y' in params %}
    G28 Y
  {% endif %}
  {% if home_all or 'Z' in params %}
    G0 X77 Y130 F18000
    G28 Z
    G90
    G0 Z2 F1000
    G4 S1
    M400
    PROBE_EDDY_NG_PROBE_STATIC HOME_Z=1
    G0 Z5 F1000
  {% endif %}

[bed_screws]
screw1: 30, 30
screw1_name: front left screw
screw2: 165, 30
screw2_name: front right screw
screw3: 165, 170
screw3_name: rear right screw
screw4: 30, 170
screw4_name: rear left screw

[input_shaper]
damping_ratio_x: 0.001
damping_ratio_y: 0.001

[fan]
pin: PA3 
hardware_pwm: true
cycle_time: 0.00004       # 25kHz Intel Spec
kick_start_time: 0.5      # The automated "finger push" (0.5 seconds of full power)
min_power: 0.02           # Replaces off_below. Fan will never be driven lower than 2%.
max_power: 0.1          # Uncomment this later if the fan overpowers your heater!

[heater_fan hotend_fan]
pin: PA4 
heater: extruder
heater_temp: 50.0

# [temperature_fan MCU_Fan]
# pin: CB1:gpio79 
# sensor_type: temperature_combined
# sensor_list: temperature_sensor pi, temperature_sensor mcu
# combination_method: max
# maximum_deviation: 999
# min_speed: 0
