# ==============================================================================
# BTT MINI 12864 v2.x DISPLAY CONFIGURATION
# ==============================================================================
# WARNING: Only uncomment the line below if you actually have a 'menu.cfg' file 
# in your configuration folder, otherwise Klipper will crash on boot.
# [include menu.cfg] 

# ==============================================================================
# 1. HARDWARE DEFINITIONS (Display, Beeper, & LEDs)
# ==============================================================================
[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
contrast: 63
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
spi_bus: spi2  # Switched to Hardware SPI for better stability on the Manta M5P

[output_pin beeper]
pin: EXP1_1

[neopixel btt_mini12864]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 1.0

[gcode_macro BEEP]
description: Sound the beeper for 500ms
gcode:
    SET_PIN PIN=beeper VALUE=1
    G4 P500
    SET_PIN PIN=beeper VALUE=0

[include menu.cfg]

# ==============================================================================
# 2. NEOPIXEL ANIMATION PROFILES (klipper-led_effect)
# ==============================================================================
[led_effect status_ready]
autostart: true
frame_rate: 24
leds: neopixel:btt_mini12864
layers:
    static  1 0 top (1.0, 1.0, 1.0) # Slow, calm Blue

[led_effect status_busy]
autostart: false
frame_rate: 24
leds: neopixel:btt_mini12864
layers:
    breathing  3 1 top (1.0, 0.0, 0.0) # Pulses Red

[led_effect status_heating]
autostart: false
frame_rate: 24
leds: neopixel:btt_mini12864
layers:
    breathing  3 1 top (1.0, 0.18, 0.0) # Pulses Orange

[led_effect status_homing]
autostart: false
frame_rate: 24
leds: neopixel:btt_mini12864
layers:
    breathing  3 1 top (0.0, 0.6, 0.2) # Pulses Teal

[led_effect status_meshing]
autostart: false
frame_rate: 24
leds: neopixel:btt_mini12864
layers:
    breathing  3 1 top (0.2, 1.0, 0.0) # Pulses Lime Green

[led_effect status_purging]
autostart: false
frame_rate: 24
leds: neopixel:btt_mini12864
layers:
    breathing  3 1 top (1.0, 0.0, 1.0) # Pulses Magenta

[led_effect status_printing]
autostart: false
frame_rate: 24
leds: neopixel:btt_mini12864
layers:
    static  1 0 top (1.0, 1.0, 1.0) # Solid White for visibility

[led_effect status_paused]
autostart: false
frame_rate: 24
leds: neopixel:btt_mini12864
layers:
    strobe 1.5 0.5 top (1.0, 0.8, 0.0) # Warning Yellow flash

[led_effect status_canceled]
autostart: false
frame_rate: 24
leds: neopixel:btt_mini12864
layers:
    strobe 1.5 0.5 top (1.0, 0.0, 0.0) # Error Red flash

[led_effect status_part_ready]
autostart: false
frame_rate: 24
leds: neopixel:btt_mini12864
layers:
    breathing  3 1 top (0.0, 1.0, 0.0) # Success Green

# ==============================================================================
# 3. NEOPIXEL STATE TRIGGERS (Called by Macro.cfg)
# ==============================================================================
[gcode_macro status_ready]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=status_ready

[gcode_macro status_busy]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=status_busy

[gcode_macro status_heating]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=status_heating

[gcode_macro status_homing]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=status_homing

[gcode_macro status_meshing]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=status_meshing

[gcode_macro status_purging]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=status_purging

[gcode_macro status_printing]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=status_printing

[gcode_macro status_paused]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=status_paused

[gcode_macro status_canceled]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=status_canceled

[gcode_macro status_part_ready]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=status_part_ready

[gcode_macro status_off]
gcode:
    STOP_LED_EFFECTS
    SET_LED LED="btt_mini12864" RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1