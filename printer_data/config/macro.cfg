# ==============================================================================
# 1. INITIALIZATION & BED MESH (EDDY-NG)
# ==============================================================================
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
    RESPOND TYPE=echo MSG="🌐 EDDY: Starting High-Speed Bed Mesh..."
    EDDYNG_BED_MESH_EXPERIMENTAL {rawparams}
    RESPOND TYPE=echo MSG="🌐 EDDY: Bed Mesh Complete."

[gcode_macro G29]
description: Bed Levelling Eddy
gcode:
    BED_MESH_CALIBRATE

# ==============================================================================
# 2. HOMING & KINEMATIC RECOVERY
# ==============================================================================
[gcode_macro _CHOME]
description: Conditional Homing
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=echo MSG="🏠 SYSTEM: Axes not homed. Homing now..."
        G28
        RESPOND TYPE=echo MSG="🏠 SYSTEM: Homed all axis."
    {% else %}
        RESPOND TYPE=echo MSG="🏠 SYSTEM: Axes already homed. Skipping."
    {% endif %}

[homing_override]
axes: xyz
set_position_z: 0
gcode:
  FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=15 ACCEL=100
  G90
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% if home_all or 'X' in params %}
    G28 X
  {% endif %}
  {% if home_all or 'Y' in params %}
    G28 Y
  {% endif %}
  {% if home_all or 'Z' in params %}
    G0 X77 Y130 F18000
    G28 Z
    G90
    G0 Z2 F1000
    G4 S1
    M400
    PROBE_EDDY_NG_PROBE_STATIC HOME_Z=1
    G0 Z5 F1000
  {% endif %}

[gcode_macro HOMING_FIX]
description: Kinematic override to lower bed without homing
gcode:
    RESPOND TYPE=echo MSG="⚠️ SYSTEM: Executing Kinematic Homing Fix!"
    G90
    SET_KINEMATIC_POSITION X=10 Y=190 Z=0
    G0 Z10 F1000  
    G0 X10 Y190 F3000 
    M84
    RESPOND TYPE=echo MSG="⚠️ SYSTEM: Kinematic Homing Fix Complete. Motors disabled."

[gcode_macro BED_DOWN]
description: Kinematic override to lower bed (Z only)
gcode:
    RESPOND TYPE=echo MSG="⚠️ SYSTEM: Forcing Bed Down."
    G90
    SET_KINEMATIC_POSITION Z=0
    G0 Z10 F1000  
    M84

# ==============================================================================
# 3. PRINT START ROUTINE
# ==============================================================================
[gcode_macro START_PRINT]
description = Ultra-robust Eddy-NG Start Routine with NeoPixel Sync & Heavy Purge
gcode:
    # 1. --- FETCH SLICER PARAMETERS ---
    {% set BED_TEMP = params.BED_TEMP|default(65)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(205)|float %}
    {% set SOAK_TIME = params.SOAK_TIME|default(0)|float %}
    {% set MATERIAL = params.MATERIAL|default('PLA')|string %}
    
    # 2. --- DYNAMIC MATERIAL LOGIC (TAP TEMPS) ---
    {% if MATERIAL == 'PLA' %}
        {% set TAP_TEMP = 150.0 %}
    {% elif MATERIAL == 'PETG' %}
        {% set TAP_TEMP = 150.0 %}
    {% elif MATERIAL == 'ABS' or MATERIAL == 'ASA' or MATERIAL == 'PC' %}
        {% set TAP_TEMP = 190.0 %}
        {% set SOAK_TIME = params.SOAK_TIME|default(2)|float %} # Force a 2-min soak for high-temp metals
    {% elif MATERIAL == 'TPU' %}
        {% set TAP_TEMP = 140.0 %}
    {% else %}
        {% set TAP_TEMP = 150.0 %} # Safe fallback
    {% endif %}
    
    RESPOND TYPE=echo MSG="🚀 START_PRINT: Target Bed: {BED_TEMP}C, Target Nozzle: {EXTRUDER_TEMP}C, Material: {MATERIAL}"
    
    # 3. --- MACHINE SANITIZATION ---
    status_busy
    CLEAR_PAUSE
    BED_MESH_CLEAR
    SFS_DISABLE            # Prevent false runout triggers during calibration
    G90
    M220 S100
    M221 S100
    G92 E0
    
    # 4. --- PRE-HEATING & TAP PID LOAD ---
    RESPOND TYPE=echo MSG="🔥 START_PRINT: Heating bed to {BED_TEMP}C and nozzle to tap temp ({TAP_TEMP}C)..."
    M117 Pre-heating...
    M140 S{BED_TEMP}
    
    # Load the cold-tap PID math to prevent overshoot
    PID_PROFILE LOAD={MATERIAL}_TAP HEATER=extruder KEEP_TARGET=1
    M104 S{TAP_TEMP}
    
    # 5. --- HOMING & PARKING ---
    status_homing
    _CHOME
    
    # Park in the center to wait for heat
    {% set center_x = (printer.toolhead.axis_maximum.x + printer.toolhead.axis_minimum.x) / 2 %}
    {% set center_y = (printer.toolhead.axis_maximum.y + printer.toolhead.axis_minimum.y) / 2 %}
    G0 Z15 F1800
    G0 X{center_x} Y{center_y} F18000
    
    status_heating
    M117 Waiting for Temps...
    RESPOND TYPE=echo MSG="🔥 SYSTEM: Waiting for Temps..."
    M190 S{BED_TEMP}
    M109 S{TAP_TEMP}
    
    # 6. --- THERMAL SOAKING ---
    {% if SOAK_TIME > 0 %}
        RESPOND TYPE=echo MSG="⏱️ START_PRINT: Thermal soaking bed for {SOAK_TIME} minutes..."
        M117 Thermal Soaking {SOAK_TIME}m...
        G4 P{SOAK_TIME * 60000}
    {% endif %}
    
    # 7. --- EDDY-NG TAP & RAPID MESH ---
    status_meshing
    RESPOND TYPE=echo MSG="🎯 START_PRINT: Executing Eddy-NG Z-Zero Tap."
    M117 Calibrating True Z...
    PROBE_EDDY_NG_TAP TARGET_Z=-1.500
    
    M117 Rapid Scanning Mesh...
    BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1 ADAPTIVE_MARGIN=5
    M400 # Wait for mesh to finish before moving on
    
    # 8. --- FINAL HEATING & PRINT PID LOAD ---
    status_heating
    RESPOND TYPE=echo MSG="🔥 START_PRINT: Loading {MATERIAL} PID Profile and final heating to {EXTRUDER_TEMP}C..."
    M117 Final Heating...
    
    # Move to front-left corner to prepare for purge
    {% set min_x = printer.toolhead.axis_minimum.x|float %}
    G0 Z10 F1800
    G0 X{min_x + 5} Y5 F18000
    
    # Load high-speed printing PID math
    PID_PROFILE LOAD={MATERIAL} HEATER=extruder KEEP_TARGET=1
    M109 S{EXTRUDER_TEMP}
    
    # 9. --- HEAVY PURGE LINE ---
    status_purging
    RESPOND TYPE=echo MSG="💦 START_PRINT: Executing Heavy Purge."
    M117 Purging...
    
    G92 E0
    G0 Z0.28 F500
    G1 X{min_x + 45} E15 F1200
    G1 X{min_x + 80} F9000
    G0 Z2 F9000
    G92 E0
    
    # 10. --- HANDOFF TO PRINT ---
    SFS_ENABLE             # Re-arm the filament sensor
    status_printing
    RESPOND TYPE=echo MSG="🟢 START_PRINT: Sequence Complete. Beginning Print!"
    M117 Print Started!

[gcode_macro PRINT_START]
gcode:
    START_PRINT {rawparams}

# ==============================================================================
# 4. PRINT END ROUTINE
# ==============================================================================
[gcode_macro END_PRINT]
description = Safe shutdown, dynamic park, and ooze prevention
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set z_lift = svv.z_lift_amount | default(10.0) | float %}
    {% set park_off = svv.park_offset | default(10.0) | float %}
    
    RESPOND TYPE=echo MSG="🏁 END_PRINT: Print Finished. Initiating shutdown sequence."
    
    M83
    G1 E-2 F3000
    G1 E-5 F300
    M82
    
    # Dynamic Z-Safe calculation
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - z_lift) %}
        {% set z_safe = z_lift %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    
    # Dynamic Park coordinates (Back-Left)
    {% set park_x = printer.toolhead.axis_minimum.x + park_off %}
    {% set park_y = printer.toolhead.axis_maximum.y - park_off %}
    
    RESPOND TYPE=echo MSG="🅿️ END_PRINT: Parking toolhead at X:{park_x} Y:{park_y} and lifting Z by {z_safe}mm."
    G91
    G1 Z{z_safe} F1800
    G90
    G0 X{park_x} Y{park_y} F18000
    
    M104 S0
    M140 S0
    M107
    
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
    BED_MESH_CLEAR
    SFS_DISABLE
    
    M84 X Y E
    RESPOND TYPE=echo MSG="🛑 END_PRINT: Heaters and XYE motors disabled. Z remains energized."
    M117 Print Complete!
    G4 P5000
    M117
# ==============================================================================
# 5. CANCEL ROUTINE
# ==============================================================================
[gcode_macro CANCEL_PRINT]
description = Cancel print, relieve pressure, and safely park
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set retract = svv.retract_pause | default(3.0) | float %}
    {% set z_lift = svv.z_lift_amount | default(10.0) | float %}
    {% set park_off = svv.park_offset | default(10.0) | float %}
    {% set safe_extrude = svv.safe_extrusion_temp | default(170.0) | float %}
    
    RESPOND TYPE=echo MSG="❌ CANCEL_PRINT: Print cancellation requested."
    
    {% if printer.extruder.temperature >= safe_extrude %}
        RESPOND TYPE=echo MSG="❌ CANCEL_PRINT: Hotend active. Relieving pressure."
        M83
        G1 E-{retract} F3000
        M82
    {% endif %}
    
    TURN_OFF_HEATERS
    
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - z_lift) %}
        {% set z_safe = z_lift %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    
    {% set park_x = printer.toolhead.axis_minimum.x + park_off %}
    {% set park_y = printer.toolhead.axis_maximum.y - park_off %}
    
    G91
    G1 Z{z_safe} F1800
    G90
    G0 X{park_x} Y{park_y} F18000
    
    M107
    SFS_DISABLE
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
    BED_MESH_CLEAR
    M84 X Y E
    
    BASE_CANCEL_PRINT
    RESPOND TYPE=echo MSG="❌ CANCEL_PRINT: Cancellation Complete."
    M117 Print Cancelled!

# ==============================================================================
# PAUSE / RESUME ROUTINE
# ==============================================================================
[gcode_macro PAUSE]
description = Pause print, disable SFS, and park safely
rename_existing: BASE_PAUSE
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set retract = svv.retract_pause | default(3.0) | float %}
    {% set z_lift_target = svv.z_lift_amount | default(10.0) | float %}
    {% set park_off = svv.park_offset | default(10.0) | float %}
    
    RESPOND TYPE=echo MSG="⏸️ PAUSE: Suspending print and disabling SFS."
    BASE_PAUSE
    SAVE_GCODE_STATE NAME=PAUSE_state
    SFS_DISABLE
    
    {% set park_x = printer.toolhead.axis_minimum.x + park_off %}
    {% set park_y = printer.toolhead.axis_maximum.y - park_off %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    
    {% if act_z < (max_z - z_lift_target) %}
        {% set z_lift = z_lift_target %}
    {% else %}
        {% set z_lift = max_z - act_z %}
    {% endif %}
    
    M83
    G1 E-{retract} F2100
    
    G91
    G1 Z{z_lift} F1800
    G90
    G0 X{park_x} Y{park_y} F18000
    RESPOND TYPE=echo MSG="⏸️ PAUSE: Toolhead parked safely."

[gcode_macro RESUME]
description = Smart resume with cold-extrusion protection
rename_existing: BASE_RESUME
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set prime = svv.prime_resume | default(5.0) | float %}
    {% set safe_extrude = svv.safe_extrusion_temp | default(170.0) | float %}
    {% set EXTRUDER_TARGET = printer.extruder.target %}
    
    RESPOND TYPE=echo MSG="▶️ RESUME: Checking temps and preparing to resume."
    
    {% if EXTRUDER_TARGET > 0 %}
        M109 S{EXTRUDER_TARGET}
    {% endif %}
    
    M83
    {% if printer.extruder.temperature >= safe_extrude %}
        RESPOND TYPE=echo MSG="▶️ RESUME: Priming nozzle ({prime}mm)."
        G1 E{prime} F2100
        G1 E-1.5 F3000
    {% else %}
        RESPOND TYPE=echo MSG="⚠️ RESUME: Extruder too cold to prime! Skipping."
    {% endif %}
    
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=300
    
    {% if printer.extruder.temperature >= safe_extrude %}
        G1 E1.5 F3000
    {% endif %}
    M82
    
    SFS_ENABLE
    RESPOND TYPE=echo MSG="▶️ RESUME: Executing base resume."
    BASE_RESUME

# ==============================================================================
# 6. CALIBRATION & FILAMENT ROUTINE
# ==============================================================================
[gcode_macro CALIBRATE_ALL_PID]
description: Calibrate and save PID profiles sequentially from lowest to highest temp (NO FAN)
gcode:
    # --- CONFIGURATION VARIABLES ---
    # Tap Temps
    {% set tpu_tap = 140 %}
    {% set pla_tap = 150 %}
    {% set petg_tap = 150 %}
    {% set abs_tap = 190 %}
    
    # Print Temps
    {% set pla_temp = 210 %}
    {% set tpu_temp = 230 %}
    {% set petg_temp = 240 %}
    {% set abs_temp = 250 %}
    # -------------------------------

    RESPOND TYPE=echo MSG="🔥 MASTER PID: Starting NO-FAN low-to-high calibration sequence..."
    
    _CHOME
    G0 Z25 F1000
    G0 X105 Y100 F9000

    # ==========================================
    # 1. TPU TAP (140°C)
    # ==========================================
    RESPOND TYPE=echo MSG="🔧 MASTER PID (1/7): Calibrating TPU Tap ({tpu_tap}C @ 0% Fan)..."
    M106 S0
    PID_CALIBRATE HEATER=extruder TARGET={tpu_tap}
    PID_PROFILE SAVE=TPU_TAP HEATER=extruder

    # ==========================================
    # 2. PLA & PETG TAP (150°C) - COMBINED
    # ==========================================
    RESPOND TYPE=echo MSG="🔧 MASTER PID (2/7): Calibrating PLA & PETG Tap (150C @ 0% Fan)..."
    M106 S0
    PID_CALIBRATE HEATER=extruder TARGET=150
    PID_PROFILE SAVE=PLA_TAP HEATER=extruder
    PID_PROFILE SAVE=PETG_TAP HEATER=extruder

    # ==========================================
    # 3. ABS TAP (190°C)
    # ==========================================
    RESPOND TYPE=echo MSG="🔧 MASTER PID (3/7): Calibrating ABS Tap ({abs_tap}C @ 0% Fan)..."
    M106 S0
    PID_CALIBRATE HEATER=extruder TARGET={abs_tap}
    PID_PROFILE SAVE=ABS_TAP HEATER=extruder

    # ==========================================
    # 4. PLA PRINT (210°C)
    # ==========================================
    RESPOND TYPE=echo MSG="🔧 MASTER PID (4/7): Calibrating PLA Print ({pla_temp}C @ 0% Fan)..."
    M106 S0
    PID_CALIBRATE HEATER=extruder TARGET={pla_temp}
    PID_PROFILE SAVE=PLA HEATER=extruder

    # ==========================================
    # 5. TPU PRINT (230°C)
    # ==========================================
    RESPOND TYPE=echo MSG="🔧 MASTER PID (5/7): Calibrating TPU Print ({tpu_temp}C @ 0% Fan)..."
    M106 S0
    PID_CALIBRATE HEATER=extruder TARGET={tpu_temp}
    PID_PROFILE SAVE=TPU HEATER=extruder

    # ==========================================
    # 6. PETG PRINT (240°C)
    # ==========================================
    RESPOND TYPE=echo MSG="🔧 MASTER PID (6/7): Calibrating PETG Print ({petg_temp}C @ 0% Fan)..."
    M106 S0
    PID_CALIBRATE HEATER=extruder TARGET={petg_temp}
    PID_PROFILE SAVE=PETG HEATER=extruder

    # ==========================================
    # 7. ABS PRINT (250°C)
    # ==========================================
    RESPOND TYPE=echo MSG="🔧 MASTER PID (7/7): Calibrating ABS Print ({abs_temp}C @ 0% Fan)..."
    M106 S0
    PID_CALIBRATE HEATER=extruder TARGET={abs_temp}
    PID_PROFILE SAVE=ABS HEATER=extruder

    # ==========================================
    # SHUTDOWN & SAVE
    # ==========================================
    M107  
    M104 S0  
    
    RESPOND TYPE=echo MSG="✅ MASTER PID: All NO-FAN profiles calibrated! Type SAVE_CONFIG to commit them to disk."

[gcode_macro LOAD_FILAMENT]
description = Smart loading that respects current temps and saved lengths
gcode:
    {% set saved_vars = printer.save_variables.variables %}
    {% set MIN_TEMP = saved_vars.filament_min_temp | default(230.0) | float %}
    {% set PURGE_LEN = saved_vars.filament_load_length | default(100.0) | float %}
    
    {% set CURRENT_TEMP = printer.extruder.temperature|float %}
    {% set TARGET_TEMP = printer.extruder.target|float %}
    
    # Calculate the safest temperature to load at
    {% if TARGET_TEMP > MIN_TEMP %}
        {% set SAFE_TEMP = TARGET_TEMP %}
    {% elif CURRENT_TEMP > MIN_TEMP %}
        {% set SAFE_TEMP = CURRENT_TEMP %}
    {% else %}
        {% set SAFE_TEMP = MIN_TEMP %}
    {% endif %}
    
    RESPOND TYPE=echo MSG="🔄 FILAMENT: Ensuring nozzle is at {SAFE_TEMP}C for safe loading..."
    M109 S{SAFE_TEMP}
    
    M83
    G1 E{PURGE_LEN} F250
    M82
    RESPOND TYPE=echo MSG="✅ FILAMENT: Load Complete."

[gcode_macro UNLOAD_FILAMENT]
description = Smart unloading that respects current temps and saved lengths
gcode:
    {% set saved_vars = printer.save_variables.variables %}
    {% set MIN_TEMP = saved_vars.filament_min_temp | default(230.0) | float %}
    {% set UNLOAD_LEN = saved_vars.filament_unload_length | default(100.0) | float %}
    
    {% set CURRENT_TEMP = printer.extruder.temperature|float %}
    {% set TARGET_TEMP = printer.extruder.target|float %}
    
    # Calculate the safest temperature to unload at
    {% if TARGET_TEMP > MIN_TEMP %}
        {% set SAFE_TEMP = TARGET_TEMP %}
    {% elif CURRENT_TEMP > MIN_TEMP %}
        {% set SAFE_TEMP = CURRENT_TEMP %}
    {% else %}
        {% set SAFE_TEMP = MIN_TEMP %}
    {% endif %}
    
    RESPOND TYPE=echo MSG="🔄 FILAMENT: Ensuring nozzle is at {SAFE_TEMP}C for safe unloading..."
    M109 S{SAFE_TEMP}
    
    M83
    # Quick push to form a clean tip, pause to let it solidify slightly, then rapid yank
    G1 E10 F300
    G1 E-15 F1000
    G4 P1500
    G1 E-{UNLOAD_LEN} F1000
    M82
    RESPOND TYPE=echo MSG="✅ FILAMENT: Unload Complete."

[gcode_macro M600]
description = Slicer filament change intercept
gcode:
    RESPOND TYPE=echo MSG="🛑 M600: Slicer requested filament change!"
    M117 Filament Change
    PAUSE

[gcode_macro M104]
description = Intercepts M104 to prevent Kalico PID drops
rename_existing: M99104
gcode:
    {% set S = params.S|default(0)|float %}
    {% if S > 0 %}
        # Optional: Add LOAD_PID logic here later if you do 5-degree interval sweeps
        RESPOND TYPE=echo MSG="🔥 M104: Slicer changing temp to {S}C mid-print."
    {% endif %}
    M99104 {rawparams}

[gcode_macro M109]
description = Intercepts M109 to prevent Kalico PID drops and wait
rename_existing: M99109
gcode:
    {% set S = params.S|default(0)|float %}
    {% if S > 0 %}
        RESPOND TYPE=echo MSG="🔥 M109: Slicer waiting for {S}C..."
    {% endif %}
    M99109 {rawparams}

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True

[gcode_macro INIT_SYSTEM_VARS]
description = One-time setup to populate variables.cfg with baseline defaults for BugBu
gcode:
    RESPOND TYPE=echo MSG="⚙️ SYSTEM: Writing base variables to disk..."
    
    # Park & Lift Offsets
    SAVE_VARIABLE VARIABLE=z_lift_amount VALUE=10.0
    SAVE_VARIABLE VARIABLE=park_offset VALUE=10.0
    
    # Extrusion Safety
    SAVE_VARIABLE VARIABLE=safe_extrusion_temp VALUE=170.0
    SAVE_VARIABLE VARIABLE=retract_pause VALUE=3.0
    SAVE_VARIABLE VARIABLE=prime_resume VALUE=5.0
    SAVE_VARIABLE VARIABLE=standby_temp VALUE=150.0

    # Filament Lengths
    SAVE_VARIABLE VARIABLE=filament_min_temp VALUE=230.0
    SAVE_VARIABLE VARIABLE=filament_load_length VALUE=100.0
    SAVE_VARIABLE VARIABLE=filament_unload_length VALUE=100.0
    
    RESPOND TYPE=echo MSG="✅ SYSTEM: Variables initialized! You can now safely edit variables.cfg directly."